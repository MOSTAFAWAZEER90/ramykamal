<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رامي كمال – صانع السعادة</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#eef4ff; --glow:rgba(14,165,233,.22); --card:#ffffff; --card-b:#d9e4f7; --text:#0b1d3f; --muted:#5b6b8a;
  --accent:#f5a800; --navy1:#061333; --navy2:#0b2a6b; --cyan:#0ea5e9;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#050d24; --glow:rgba(14,165,233,.28); --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.12); --text:#f3f7ff; --muted:#9db0d3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#050d24; --glow:rgba(14,165,233,.28); --card:rgba(255,255,255,.06); --card-b:rgba(255,255,255,.12); --text:#f3f7ff; --muted:#9db0d3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--text); background:var(--page);
  font-family:"Cairo","Tajawal","Segoe UI",Tahoma,Arial,sans-serif; display:flex; justify-content:center;
  background-image:radial-gradient(60% 40% at 50% 0%,var(--glow),transparent 70%);
  background-repeat:no-repeat;
}
main{width:100%; max-width:480px; padding-bottom:40px}

/* Hero */
.hero{
  position:relative; overflow:hidden; text-align:center; color:#fff; padding:44px 20px 64px;
  background:linear-gradient(165deg,var(--navy1) 0%,var(--navy2) 60%,#0a6fb8 100%);
  border-radius:0 0 36px 36px;
}
.hero::before{
  content:""; position:absolute; inset:0; opacity:.5;
  background:radial-gradient(circle at 50% 38%,rgba(14,165,233,.7),transparent 55%);
}
.hero::after{
  content:""; position:absolute; inset:0; opacity:.14;
  background-image:radial-gradient(#ffc629 1.4px,transparent 1.6px); background-size:16px 16px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%); mask-image:linear-gradient(180deg,#000,transparent 70%);
}
.hero > *{position:relative; z-index:1}
.photo-wrap{position:relative; width:168px; height:168px; margin:0 auto 18px}
.photo{
  width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
  border:4px solid #ffc629; box-shadow:0 0 0 6px rgba(255,198,41,.22),0 14px 34px rgba(0,0,0,.45);
}
.logo{
  position:absolute; left:-14px; bottom:-8px; width:76px; height:76px; border-radius:50%; background:#fff;
  padding:7px; box-shadow:0 8px 20px rgba(0,0,0,.4); border:3px solid #ffc629;
}
.logo img{width:100%; height:100%; object-fit:contain; display:block}
h1{margin:0; font-size:32px; font-weight:800; line-height:1.3; letter-spacing:.2px}
.role{
  display:inline-block; margin-top:10px; padding:6px 18px; border-radius:999px; font-weight:800; font-size:16px;
  color:#3a2600; background:linear-gradient(90deg,#ffd45c,#ffb300); box-shadow:0 6px 16px rgba(255,179,0,.4);
}

/* Links */
.links{display:flex; flex-direction:column; gap:14px; padding:0 18px; margin-top:-30px; position:relative; z-index:2}
a.link{
  --c:#0ea5e9; --d:0s;
  position:relative; overflow:hidden; display:flex; align-items:center; gap:16px; padding:14px 16px; border-radius:20px; text-decoration:none;
  color:var(--text); background:var(--card); border:1px solid var(--card-b);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 6px 18px rgba(11,29,63,.08);
  transition:transform .2s, box-shadow .2s, border-color .2s;
  opacity:0; translate:0 18px; animation:in .6s cubic-bezier(.2,.8,.2,1) var(--d) forwards;
}
a.link::after{
  content:""; position:absolute; top:-10%; bottom:-10%; left:-120px; width:70px; pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent); transform:skewX(-20deg);
  animation:shine 5.5s ease-in-out calc(var(--d) + 1.2s) infinite;
}
@keyframes in{to{opacity:1; translate:0 0}}
@keyframes shine{0%,62%{left:-120px}100%{left:130%}}
a.link:hover,a.link:focus-visible{transform:translateY(-4px) scale(1.015); border-color:var(--c); box-shadow:0 14px 30px color-mix(in srgb,var(--c) 38%,transparent); outline:none}
a.link:active{transform:scale(.97)}
a.link:nth-child(1){--d:.05s} a.link:nth-child(2){--d:.15s} a.link:nth-child(3){--d:.25s}
a.link:nth-child(4){--d:.35s} a.link:nth-child(5){--d:.45s} a.link:nth-child(6){--d:.55s}

.ico{
  position:relative; flex:none; width:56px; height:56px; border-radius:18px; display:flex; align-items:center; justify-content:center; color:#fff;
  background:var(--bgi,var(--c)); box-shadow:0 8px 18px color-mix(in srgb,var(--c) 50%,transparent), inset 0 1px 0 rgba(255,255,255,.35);
  animation:bob 3.6s ease-in-out var(--d) infinite;
}
.ico::before{ /* ripple ring */
  content:""; position:absolute; inset:0; border-radius:inherit; border:2px solid var(--c);
  animation:ring 2.6s ease-out var(--d) infinite; pointer-events:none;
}
.ico::after{ /* gloss */
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,0) 48%);
}
.ico svg{position:relative; z-index:1; width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .35s}
.ico svg .f{fill:currentColor; stroke:none}
.tt svg{filter:drop-shadow(-1.3px -1px 0 #25f4ee) drop-shadow(1.3px 1px 0 #fe2c55)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ring{0%{transform:scale(1); opacity:.65}100%{transform:scale(1.4); opacity:0}}
a.link:hover .ico svg,a.link:focus-visible .ico svg{animation:wiggle .6s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-14deg) scale(1.18)}45%{transform:rotate(12deg) scale(1.18)}70%{transform:rotate(-6deg) scale(1.1)}}

.name{flex:1; text-align:right; font-weight:800; font-size:18px; min-width:0}
.name small{display:block; color:var(--muted); font-weight:500; font-size:13px; margin-top:3px; direction:ltr; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.go{flex:none; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb,var(--c) 16%,transparent); color:var(--c); font-size:20px; font-weight:800; animation:nudge 1.8s ease-in-out var(--d) infinite}
a.link:hover .go{background:var(--c); color:#fff}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.photo{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px rgba(255,198,41,.22),0 14px 34px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 12px rgba(255,198,41,.08),0 14px 40px rgba(14,165,233,.55)}}
.logo{animation:bob 3.2s ease-in-out infinite}
.role{animation:pop .7s cubic-bezier(.3,1.6,.5,1) .1s both}
@keyframes pop{from{transform:scale(.6); opacity:0}to{transform:scale(1); opacity:1}}
footer{margin-top:34px; text-align:center; color:var(--muted); font-size:13px}
footer b{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important; transition:none !important} a.link{opacity:1; translate:none}}
</style>
</head>
